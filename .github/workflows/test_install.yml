name: Test package installation

on:
  push:
  pull_request:

env:
  NO_ALBUMENTATIONS_UPDATE: "1"

jobs:
  test-user-installation:
    name: Wheel - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build setuptools wheel
      - run: python -m build --wheel
      - name: Install wheel and test tools
        run: |
          for wheel in dist/*.whl; do python -m pip install "${wheel}[cpu,fast]"; done
          python -m pip install pytest pytest-cov onnx
        shell: bash
      - run: python -m pip check
      - name: Verify installed package outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/package/wheel_smoke.py"
        shell: bash
      - name: Run inference tests
        run: python -m pytest tests -q -o pythonpath= --cov=manuscript --cov-branch --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: inference-only
          token: ${{ secrets.CODECOV_TOKEN }}

  test-dev-installation:
    name: Integration - ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[cpu,dev]"
      - run: python -m pip check
      - name: Show native ML environment
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.9'
        run: python -m torch.utils.collect_env
      - name: Run unit and integration tests
        run: python -m pytest tests -v --require-integration-deps --cov=manuscript --cov-branch --cov-report=xml --cov-fail-under=80
      - name: Check Python errors
        run: python -m flake8 src/manuscript tests scripts --select=E9,F63,F7,F82 --exclude=__pycache__ --count
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: dev-installation
          token: ${{ secrets.CODECOV_TOKEN }}
